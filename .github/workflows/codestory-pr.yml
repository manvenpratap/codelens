name: CodeStory PR Change Story

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  change-story:
    name: Architecture & Blast Radius Change Story
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build CodeLens Application
        run: mvn package -DskipTests -q

      - name: Ingest Repository & Generate PR Change Story
        id: codestory
        run: |
          # 1. Ingest repository to build deterministic AST graph & H2 index
          java -jar codelens-app/target/codelens-app.jar scan .

          # 2. Run PR Change Story against the PR base ref
          BASE_REF="origin/${{ github.base_ref }}"
          java -jar codelens-app/target/codelens-app.jar pr-story "$BASE_REF" HEAD --markdown --output=pr-story.md

      - name: Attach Change Story to GitHub Actions Summary
        if: always()
        run: |
          if [ -f pr-story.md ]; then
            cat pr-story.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment PR Change Story on Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr-story.md')) return;
            const body = fs.readFileSync('pr-story.md', 'utf8');
            const commentHeader = '<!-- codestory-pr-change-story -->';
            const fullBody = commentHeader + '\n\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(commentHeader));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody
              });
            }
