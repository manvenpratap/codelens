# ═══════════════════════════════════════════════════════════════════════════════
# CodeLens Deployment Configuration (codelens.conf)
# Generated: 2026-08-28T11:50:35.848105Z
# Use this file to import and restore settings on new deployments.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Server & Storage ──
server.port=7878
storage.dataDir=./codelens-data
scan.defaultPath=
scan.excludePatterns=build, target, dist

# ── UI & Appearance ──
ui.theme=light
ui.packageMode=auto
ui.defaultTab=graph
ui.tabOrder=["graph","knowledge","review","git","source"]

# ── Graph Physics & Visuals ──
graph.nodeBaseRadius=18
graph.repulsion=420
graph.springLen=120
graph.damping=0.85
graph.showParticles=true
graph.showMinimap=true
graph.showLabels=true
graph.showGrid=true
graph.showHulls=true
graph.defaultDepth=3
graph.autoFit=true

# ── Macro 3D & 2D Studio ──
macro.defaultLevel=city3d
macro.defaultGranularity=arch
macro.brightness=1.0
macro.showArcs=true
macro.autoRotate=false
macro.showWireframe=false

# ── Code Review Thresholds ──
review.cyclomaticComplexityThreshold=15
review.cognitiveComplexityThreshold=15
review.methodLinesThreshold=50
review.classLinesThreshold=500
review.parameterCountThreshold=6

# ── POJO Classification ──
pojo.includeStandardAccessors=true
pojo.customPatterns=get*, set*, is*, has*, with*

# ── Custom Archetype Rules ──
archetypes.rulesJson=[{"id":"rule-bancs-et","target":"METHOD","scope":"METHOD","matchType":"PREFIX","pattern":"{MODULE}ET","label":"Elementary Transaction","badge":"FETCH","category":"READ_ONLY","color":"#10b981","icon":"download","description":"Elementary transactions only meant for fetching data","enabled":true},{"id":"rule-bancs-bt","target":"METHOD","scope":"METHOD","matchType":"PREFIX","pattern":"{MODULE}BT","label":"Business Transaction","badge":"MUTATE","category":"MUTATION","color":"#f59e0b","icon":"zap","description":"Business transactions meant for create/update data","enabled":true},{"id":"rule-bancs-ps","target":"METHOD","scope":"METHOD","matchType":"PREFIX","pattern":"{MODULE}PS","label":"Batch Processor","badge":"BATCH","category":"BATCH","color":"#8b5cf6","icon":"settings","description":"Batch processor / background jobs","enabled":true},{"id":"rule-bancs-pb","target":"METHOD","scope":"METHOD","matchType":"PREFIX","pattern":"{MODULE}PB","label":"Process Before Batch","badge":"PRE-BATCH","category":"PRE_PROCESS","color":"#3b82f6","icon":"skipBack","description":"Process before batch execution","enabled":true},{"id":"rule-bancs-pa","target":"METHOD","scope":"METHOD","matchType":"PREFIX","pattern":"{MODULE}PA","label":"Process After Batch","badge":"POST-BATCH","category":"POST_PROCESS","color":"#ec4899","icon":"skipForward","description":"Process after batch execution","enabled":true},{"id":"rule-bancs-dg","target":"CLASS","scope":"CLASS","matchType":"PREFIX","pattern":"{MODULE}DG","label":"Data Grabber","badge":"DATA-GRABBER","category":"DATA_ACCESS","color":"#06b6d4","icon":"box","description":"Data grabber / data retrieval components","enabled":true}]
